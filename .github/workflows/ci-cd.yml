name: CI/CD Pipeline — ESG Resíduos

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '17'

jobs:
  # ============================================================
  # JOB 1 — BUILD & TEST
  # ============================================================
  build-and-test:
    name: 🔨 Build & Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: esg_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 📦 Cache de dependências Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🔍 Verificar versões
        run: |
          java -version
          mvn -version

      - name: 🧪 Executar testes unitários
        run: mvn test -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/esg_test
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: 📊 Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 15

      - name: 🏗️ Build da aplicação (sem testes)
        run: mvn package -DskipTests -B

      - name: 📤 Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 5

  # ============================================================
  # JOB 2 — BUILD & PUSH DA IMAGEM DOCKER
  # ============================================================
  docker-build:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔐 Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extrair metadados Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build e Push da imagem
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔒 Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================
  # JOB 3 — DEPLOY STAGING
  # ============================================================
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: http://${{ secrets.STAGING_HOST }}:8080

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH no servidor Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploy Staging iniciado ==="
            cd /opt/esg-residuos

            # Atualiza imagens
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull

            # Reinicia serviços com zero downtime
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans

            # Aguarda health check
            echo "Aguardando health check..."
            sleep 30
            curl -f http://localhost:8080/actuator/health || (echo "Health check falhou!" && exit 1)

            echo "=== Deploy Staging concluído com sucesso ==="
            docker ps

      - name: ✅ Verificar saúde do Staging
        run: |
          sleep 15
          curl -f http://${{ secrets.STAGING_HOST }}:8080/actuator/health \
            && echo "Staging OK!" || echo "Staging health check pendente"

  # ============================================================
  # JOB 4 — DEPLOY PRODUÇÃO
  # ============================================================
  deploy-production:
    name: 🏁 Deploy Produção
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://${{ secrets.PROD_HOST }}:8080

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🏁 Deploy via SSH no servidor de Produção
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploy Produção iniciado ==="
            cd /opt/esg-residuos

            # Backup do estado atual
            docker compose ps > /tmp/backup-state-$(date +%Y%m%d-%H%M%S).txt

            # Pull da nova imagem
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Deploy com restart
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Aguarda estabilização
            echo "Aguardando estabilização..."
            sleep 45
            curl -f http://localhost:8080/actuator/health || (echo "Produção health check falhou!" && exit 1)

            echo "=== Deploy Produção concluído com sucesso ==="
            docker ps

      - name: ✅ Verificar saúde da Produção
        run: |
          sleep 20
          curl -f http://${{ secrets.PROD_HOST }}:8080/actuator/health \
            && echo "Produção OK!" || echo "Health check pendente"

      - name: 📣 Notificar sucesso
        if: success()
        run: |
          echo "Deploy de produção realizado com sucesso!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Autor: ${{ github.actor }}"
