name: CI/CD Pipeline — ESG Resíduos

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: 🔨 Build & Testes
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: admin_pass
          APP_USER: esg_user
          APP_USER_PASSWORD: esg_pass
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: 🧪 Testes Unitários
        run: mvn test -B
        env:
          DB_URL: jdbc:oracle:thin:@localhost:1521/XE
          DB_USER: esg_user
          DB_PASSWORD: esg_pass
      - name: 🏗️ Package JAR
        run: mvn package -DskipTests -B

  docker-build:
    name: 🐳 Build & Push Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: 🚀 Deploy
    needs: docker-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    environment:
      name: ${{ matrix.environment }}
      url: http://${{ matrix.environment == 'staging' && vars.STAGING_HOST || vars.PROD_HOST }}:8080
    steps:
      - name: 🏁 Log de Deploy
        run: |
          echo "Simulando deploy para o ambiente: ${{ matrix.environment }}"
          echo "IP do Servidor: ${{ matrix.environment == 'staging' && vars.STAGING_HOST || vars.PROD_HOST }}"