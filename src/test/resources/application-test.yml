# src/test/resources/application-test.yml

spring:
  # Configurando o banco H2 em memória para os testes
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password

  # Configurando o JPA para criar as tabelas automaticamente no H2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Criando as tabelas no início do teste e apaga no fim
    show-sql: true

  # Desligando o Flyway para os testes
  flyway:
    enabled: false